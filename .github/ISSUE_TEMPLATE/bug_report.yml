name: Bug report
description: Report a problem with the Sequence Home Assistant integration
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please do not paste API tokens, account IDs, balances, or Home Assistant backups.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.4.4
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Sequence integration version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted logs
      description: Redact tokens, account IDs, names, and balances before posting.
      render: text
